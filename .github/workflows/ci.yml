name: CloudBox CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m compileall -q src scripts api.py worker.py app.py main.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cloudbox-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run offline tests in the built image
        env:
          DEEPSEEK_API_KEY: ''
          OPENROUTER_API_KEY: ''
          CLOUDBOX_SKIP_UI_TESTS: '1'
          CLOUDBOX_RUN_LIVE_LLM_TESTS: '0'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          docker run --rm \
            -e DEEPSEEK_API_KEY \
            -e OPENROUTER_API_KEY \
            -e CLOUDBOX_SKIP_UI_TESTS \
            -e CLOUDBOX_RUN_LIVE_LLM_TESTS \
            -e HF_HUB_OFFLINE \
            -e TRANSFORMERS_OFFLINE \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -v "$GITHUB_WORKSPACE/compose.yaml:/app/compose.yaml:ro" \
            cloudbox-rag:ci \
            python -m unittest discover -s tests -p 'test_*.py' -v
